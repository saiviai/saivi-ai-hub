<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saivi Workspace</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <!-- Marked.js for Markdown Formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar & Modes */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 50;
      background: rgba(11, 15, 25, 0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .mode-group {
      display: flex;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.25rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Initial Landing Screen (Center Glow View) */
    .landing-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, rgba(14, 116, 144, 0.22) 0%, rgba(11, 15, 25, 0.95) 70%);
      transition: opacity 0.3s ease;
      padding: 1.5rem;
    }

    .landing-screen.hidden {
      display: none;
    }

    .welcome-heading {
      font-size: 2.2rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
      text-align: center;
    }

    /* Active Chat Screen */
    .chat-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100vh;
      padding-top: 64px;
      position: relative;
    }

    .chat-screen.active {
      display: flex;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .message-limit-width {
      width: 100%;
      max-width: 768px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .message-row {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .message-bubble {
      max-width: 80%;
      padding: 0.9rem 1.2rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .message-row.ai .message-bubble {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-top-left-radius: 4px;
    }

    .message-row.user .message-bubble {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 500;
      border-top-right-radius: 4px;
    }

    .message-bubble pre {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 0.5rem;
    }

    .message-bubble code {
      font-family: monospace;
    }

    /* Floating / Bottom Input Pill Box */
    .input-area-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 1.5rem;
    }

    .landing-screen .input-area-wrapper {
      padding: 0;
      width: 100%;
      max-width: 640px;
    }

    .chat-screen .input-area-wrapper {
      background: linear-gradient(to top, #0b0f19 80%, rgba(11, 15, 25, 0));
    }

    .pill-input-box {
      width: 100%;
      max-width: 680px;
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 36px;
      padding: 0.6rem 0.8rem 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s;
    }

    .pill-input-box:focus-within {
      border-color: #38bdf8;
    }

    .pill-input-box textarea {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: #f8fafc;
      font-size: 0.95rem;
      resize: none;
      max-height: 120px;
      min-height: 24px;
      padding-top: 2px;
    }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .action-icon-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .send-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.1s, background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #7dd3fc;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    @media(max-width: 600px) {
      .welcome-heading { font-size: 1.6rem; }
      .top-bar { padding: 0 1rem; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="top-bar">
    <div class="brand-title">Saivi Workspace</div>
    <div class="mode-group">
      <button class="mode-btn active" id="modeNormal" onclick="setMode('NORMAL')">Normal 🤖</button>
      <button class="mode-btn" id="modeSweet" onclick="setMode('SWEET')">Sweet 🌸</button>
      <button class="mode-btn" id="modeRoast" onclick="setMode('ROAST')">Roast 🔥</button>
    </div>
  </div>

  <!-- Initial Landing View (Centered Glowing Search Bar) -->
  <div class="landing-screen" id="landingScreen">
    <h1 class="welcome-heading" id="welcomeHeading">Let's jump in, Vikash</h1>
    <div class="input-area-wrapper">
      <div class="pill-input-box">
        <button class="action-icon-btn" onclick="startNewChat()">＋</button>
        <textarea id="landingInput" placeholder="Ask anything..." rows="1" onkeydown="handleLandingKey(event)"></textarea>
        <button class="send-btn" onclick="triggerFirstMessage()">➔</button>
      </div>
    </div>
  </div>

  <!-- Active Chat Workspace View -->
  <div class="chat-screen" id="chatScreen">
    <div class="messages-container" id="scrollArea">
      <div class="message-limit-width" id="chatMessages"></div>
    </div>
    
    <div class="input-area-wrapper">
      <div class="pill-input-box">
        <button class="action-icon-btn" onclick="clearAndReset()">＋</button>
        <textarea id="chatInput" placeholder="Ask anything..." rows="1" onkeydown="handleChatKey(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">➔</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForSaiviAI",
      authDomain: "saivi-ai.firebaseapp.com",
      projectId: "saivi-ai"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    auth.onAuthStateChanged(user => { currentUser = user; });

    // API Configurations
    const API_KEY = "sk-b74f581431b3f1dee07b4cd20e879296";
    const API_ENDPOINT = "https://api.bailuai.com/v1/messages";
    let activeMode = "NORMAL";

    function setMode(mode) {
      activeMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('mode' + mode.charAt(0) + mode.slice(1).toLowerCase()).classList.add('active');
    }

    function handleLandingKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        triggerFirstMessage();
      }
    }

    function handleChatKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function triggerFirstMessage() {
      const text = document.getElementById('landingInput').value.trim();
      if (!text) return;
      
      // Transition from landing view to active chat workspace
      document.getElementById('landingScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.add('active');
      document.getElementById('chatInput').value = text;
      document.getElementById('landingInput').value = "";
      
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      const container = document.getElementById('chatMessages');
      const scrollArea = document.getElementById('scrollArea');

      if (!text) return;

      // Append User Message
      container.innerHTML += `
        <div class="message-row user">
          <div class="message-bubble">${escapeHtml(text)}</div>
        </div>
      `;
      input.value = "";
      scrollArea.scrollTop = scrollArea.scrollHeight;

      // Loading Placeholder
      const loadId = "load_" + Date.now();
      container.innerHTML += `
        <div class="message-row ai" id="${loadId}">
          <div class="message-bubble">Thinking...</div>
        </div>
      `;
      scrollArea.scrollTop = scrollArea.scrollHeight;

      // Define personality modes
      let systemPrompt = "You are Saivi, a helpful assistant. Keep answers direct and clean.";
      if (activeMode === 'SWEET') {
        systemPrompt = "Adopt an extremely sweet, warm, supportive, and kind persona with maximum care.";
      } else if (activeMode === 'ROAST') {
        systemPrompt = "Adopt an elite comedic roasting persona. Give witty, clever, and hilariously funny roasts.";
      }

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: {
            "x-api-key": API_KEY,
            "anthropic-version": "2023-06-01",
            "content-type": "application/json"
          },
          body: JSON.stringify({
            model: "claude-3-5-sonnet-20241022",
            max_tokens: 1500,
            system: systemPrompt,
            messages: [{ role: "user", content: text }]
          })
        });

        const data = await response.json();
        const rawReply = data.content?.[0]?.text || data.error?.message || "Done!";
        const parsedMarkdown = marked.parse(rawReply);

        document.getElementById(loadId).outerHTML = `
          <div class="message-row ai">
            <div class="message-bubble">${parsedMarkdown}</div>
          </div>
        `;

        if (currentUser) {
          db.collection("chats").add({
            userId: currentUser.uid,
            userMsg: text,
            aiReply: rawReply,
            mode: activeMode,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      } catch (err) {
        document.getElementById(loadId).outerHTML = `
          <div class="message-row ai">
            <div class="message-bubble">Hello! Let's keep exploring your ideas. What's next?</div>
          </div>
        `;
      }
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function clearAndReset() {
      document.getElementById('chatMessages').innerHTML = "";
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('landingScreen').classList.remove('hidden');
    }

    function startNewChat() {
      clearAndReset();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
