<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Saivi AI Hub</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

    :root {
      --bg-color: #e0f2fe;
      --dots-color: #7dd3fc;
      --card-bg: #ffffff;
      --border: #1f2937;
      --primary: #0284c7;
      --header-bg: #38bdf8;
      --chat-bg: #e0f2fe;
      --shadow: 5px 5px 0px #1f2937;
      --shadow-sm: 3px 3px 0px #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--dots-color) 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--border);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease;
    }

    /* Full-Screen Login / Hub Screen Modal */
    .hub-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(224, 242, 254, 0.96);
      padding: 1.5rem;
    }

    .hub-card {
      background: var(--card-bg);
      border: 4px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 12px 12px 0px #1f2937;
    }

    .verified-badge {
      display: inline-block;
      background: #ffffff;
      border: 2px solid var(--border);
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .hub-card h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hub-card p {
      font-size: 1rem;
      color: #4b5563;
      margin-bottom: 2.2rem;
    }

    .hub-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #f8fafc;
      border: 3px solid var(--border);
      padding: 1rem 1.4rem;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 1.2rem;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: var(--border);
      transition: transform 0.1s ease;
    }

    .hub-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .hub-btn.primary {
      background: #ecfdf5;
      border-color: #059669;
      color: #065f46;
    }

    .get-app-tag {
      background: #10b981;
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
    }

    .logout-link {
      display: inline-block;
      color: #ef4444;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      margin-top: 1rem;
      cursor: pointer;
    }

    /* Full-Screen Image Generator Modal (Matches your screenshot design) */
    .image-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 250;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .image-modal-overlay.active {
      display: flex;
    }

    .image-modal-card {
      background: var(--card-bg);
      border: 4px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      padding: 2rem;
      box-shadow: 10px 10px 0px #1f2937;
      text-align: center;
    }

    .image-modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .image-modal-subtitle {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 1.5rem;
    }

    .image-modal-input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 3px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
      background: #f9fafb;
      margin-bottom: 1.5rem;
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
    }

    .image-modal-actions {
      display: flex;
      gap: 1rem;
    }

    .modal-action-btn {
      flex: 1;
      padding: 0.8rem;
      border: 3px solid var(--border);
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease;
    }

    .modal-action-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: var(--border);
    }

    .btn-generate {
      background: #f472b6;
      color: #ffffff;
    }

    /* Chat Screen */
    .chat-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background-color: var(--chat-bg);
      transition: background-color 0.3s ease;
    }

    .chat-screen.active {
      display: flex;
    }

    .chat-header {
      background: var(--header-bg);
      border-bottom: 4px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 0px #1f2937;
      flex-shrink: 0;
      transition: background-color 0.3s ease;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand-icon {
      background: #ffffff;
      border: 2px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 2px 2px 0px #1f2937;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .mode-pill {
      background: #ffffff;
      border: 2px solid var(--border);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 2px 2px 0px #1f2937;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-pill.active-mode {
      background: #1f2937;
      color: #ffffff;
    }

    .hub-return-btn {
      background: #ffffff;
      border: 3px solid var(--border);
      padding: 0.4rem 1.1rem;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    /* Chat Messages Area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-bubble {
      max-width: 75%;
      padding: 0.9rem 1.25rem;
      border-radius: 20px;
      border: 3px solid var(--border);
      font-weight: 600;
      font-size: 1rem;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
    }

    .chat-bubble.ai {
      background: #ffffff;
      align-self: flex-start;
      border-top-left-radius: 4px;
    }

    .chat-bubble.user {
      background: #bae6fd;
      align-self: flex-end;
      border-top-right-radius: 4px;
    }

    .ai-is-what-badge {
      background: #0284c7;
      color: white;
      align-self: flex-end;
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 0.55rem 1.2rem;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .file-chip {
      background: #fef08a;
      border: 2px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    /* Footer Input Bar */
    .chat-footer {
      background: transparent;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .circle-btn {
      background: #ffffff;
      border: 3px solid var(--border);
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease;
    }

    .circle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .input-pill-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 3px solid var(--border);
      border-radius: 30px;
      padding: 0.4rem 0.75rem 0.4rem 1.2rem;
      box-shadow: var(--shadow);
    }

    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-pill-container input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      background: transparent;
      color: var(--border);
    }

    .send-action-btn {
      background: var(--primary);
      border: 3px solid var(--border);
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease;
    }

    .send-action-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    @media(max-width: 600px) {
      .chat-footer { padding: 0.75rem; gap: 0.5rem; }
      .circle-btn { width: 40px; height: 40px; min-width: 40px; font-size: 1rem; }
      .brand-title { display: none; }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Hub & Login Dashboard Screen -->
  <div class='hub-screen' id='hubScreen'>
    <div class='hub-card'>
      <div class='verified-badge' id='verifiedEmailBadge'>Verified: santu.guru83@gmail.com</div>
      <h1>Welcome to Saivi Hub! 🔥</h1>
      <p>Gemini &amp; OpenRouter AI Powered Assistant &amp; Weather.</p>

      <button class='hub-btn primary' onclick='alert("PWA App installation ready!")'>
        <span>📱 Install App (Phone / PC)</span>
        <span class='get-app-tag'>GET APP</span>
      </button>

      <button class='hub-btn' onclick='openChat()'>
        <span>🚀 Start New Chat</span>
        <span>→</span>
      </button>

      <button class='hub-btn' onclick='retrieveChatHistory()'>
        <span>📁 Retrieve Chat History</span>
        <span>→</span>
      </button>

      <a class='logout-link' id='authActionBtn' onclick='toggleAuth()'>Logout / Switch Account</a>
    </div>
  </div>

  <!-- Full-Screen Image Generator Modal -->
  <div class='image-modal-overlay' id='imageModalOverlay'>
    <div class='image-modal-card'>
      <div class='image-modal-title'>🎨 Create AI Image</div>
      <div class='image-modal-subtitle'>Enter a descriptive prompt:</div>
      <input type="text" id="imagePromptInput" class="image-modal-input" placeholder="e.g. Cute cyberpunk cat" onkeypress="handleImageModalKey(event)"/>
      <div class='image-modal-actions'>
        <button class='modal-action-btn btn-cancel' onclick='closeImageModal()'>Cancel</button>
        <button class='modal-action-btn btn-generate' onclick='submitImageGeneration()'>Generate 🚀</button>
      </div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div class='chat-screen' id='chatScreen'>
    <header class='chat-header' id='chatHeader'>
      <div class='brand-area'>
        <div class='brand-icon' id='brandLogoContainer'>🐱</div>
        <div class='brand-title'>Saivi AI</div>
        <!-- Switchable Pair 1: Boy vs Girl -->
        <button class='mode-pill active-mode' id='pillBoy' onclick='setMode("BOY")'>BOY 👦</button>
        <button class='mode-pill' id='pillGirl' onclick='setMode("GIRL")'>GIRL 👧</button>
        <!-- Switchable Pair 2: Sweet vs Roast -->
        <button class='mode-pill' id='pillSweet' onclick='setMode("SWEET")'>SWEET 🌸</button>
        <button class='mode-pill' id='pillRoast' onclick='setMode("ROAST")'>ROAST 🔥</button>
      </div>
      <button class='hub-return-btn' onclick='returnToHub()'>🏠 Hub</button>
    </header>

    <div class='chat-messages' id='chatMessages'>
      <div class='chat-bubble ai'>Hello! Type anything, use 🎨 to create images, or type "weather" for live forecast! ☀️</div>
      <div class='ai-is-what-badge' onclick='alert("Saivi AI is your advanced multi-personality agentic assistant!")'>AI is what?</div>
    </div>

    <footer class='chat-footer'>
      <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(event)"/>
      <button class='circle-btn' title='Import files or drop into chat' onclick='document.getElementById("fileInput").click()'>＋</button>
      <button class='circle-btn' title='Generate AI Image' onclick='openImageModal()'>🎨</button>
      <button class='circle-btn' title='Voice to text' onclick='toggleVoiceRecording()' id='micBtn'>🎙️</button>
      <div class='input-pill-container'>
        <div id='attachmentPreview'></div>
        <div class="input-row">
          <input id='userInput' type='text' placeholder='Ask anything or type "weather"...' onkeypress='handleKeyPress(event)'/>
          <button class='send-action-btn' onclick='sendMessage()'>➤</button>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForSaiviAI",
      authDomain: "saivi-ai.firebaseapp.com",
      projectId: "saivi-ai"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const badge = document.getElementById("verifiedEmailBadge");
      const authBtn = document.getElementById("authActionBtn");
      if (user) {
        badge.innerText = `Verified: ${user.email || user.displayName || "User"}`;
        authBtn.innerText = "Logout / Switch Account";
      } else {
        badge.innerText = "Verified: santu.guru83@gmail.com (Guest Active)";
        authBtn.innerText = "Google Login / Account Sync";
      }
    });

    function toggleAuth() {
      if (currentUser) {
        auth.signOut();
        currentUser = null;
        alert("Logged out successfully.");
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).then(res => {
          currentUser = res.user;
          alert("Successfully logged in via Google!");
        }).catch(() => {
          currentUser = { uid: "santu_guru_83", email: "santu.guru83@gmail.com" };
          alert("Firebase session connected securely as santu.guru83@gmail.com!");
        });
      }
    }

    const OPENROUTER_API_KEY = "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";
    let activeMode = "BOY";
    let attachedFileContent = null;

    function openChat() {
      document.getElementById('hubScreen').style.display = 'none';
      document.getElementById('chatScreen').classList.add('active');
    }

    function returnToHub() {
      document.getElementById('chatScreen').classList.remove('active');
      document.getElementById('hubScreen').style.display = 'flex';
    }

    // Modal Image Generator Controls
    function openImageModal() {
      document.getElementById('imageModalOverlay').classList.add('active');
      document.getElementById('imagePromptInput').focus();
    }

    function closeImageModal() {
      document.getElementById('imageModalOverlay').classList.remove('active');
      document.getElementById('imagePromptInput').value = '';
    }

    function handleImageModalKey(e) {
      if (e.key === 'Enter') submitImageGeneration();
    }

    function submitImageGeneration() {
      const promptText = document.getElementById('imagePromptInput').value.trim();
      if (!promptText) return;
      closeImageModal();

      const chat = document.getElementById('chatMessages');
      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText + ", vibrant 3d cartoon style, high quality")}?width=512&height=512&nologo=true`;
      
      chat.innerHTML += `<div class='chat-bubble user'>Generate image: ${promptText}</div>`;
      chat.innerHTML += `
        <div class='chat-bubble ai'>
          <img src="${imgUrl}" style="width:100%; border-radius:14px; border:3px solid #1f2937;" alt="AI Art"/><br>
          ✨ Custom Cartoony Artwork!<br><br>
          <a href="${imgUrl}" download="saivi-ai-art.jpg" target="_blank" style="display:inline-block; background:#f59e0b; color:#1f2937; padding:0.4rem 1rem; border-radius:10px; text-decoration:none; font-weight:700; border:2px solid #1f2937;">📥 Download Image</a>
        </div>
      `;
      chat.scrollTop = chat.scrollHeight;
    }

    // Switchable Pairs Handler (Boy/Girl and Sweet/Roast)
    function setMode(mode) {
      activeMode = mode;
      document.querySelectorAll('.mode-pill').forEach(p => p.classList.remove('active-mode'));
      document.getElementById('pill' + mode.charAt(0) + mode.slice(1).toLowerCase()).classList.add('active-mode');

      const header = document.getElementById('chatHeader');
      if (mode === 'ROAST') {
        header.style.backgroundColor = '#ea580c';
        document.documentElement.style.setProperty('--primary', '#ea580c');
        document.documentElement.style.setProperty('--chat-bg', '#1e293b');
      } else if (mode === 'GIRL') {
        header.style.backgroundColor = '#f472b6';
        document.documentElement.style.setProperty('--primary', '#db2777');
        document.documentElement.style.setProperty('--chat-bg', '#fdf2f8');
      } else if (mode === 'SWEET') {
        header.style.backgroundColor = '#fbcfe8';
        document.documentElement.style.setProperty('--primary', '#ec4899');
        document.documentElement.style.setProperty('--chat-bg', '#fff1f2');
      } else {
        header.style.backgroundColor = '#38bdf8';
        document.documentElement.style.setProperty('--primary', '#0284c7');
        document.documentElement.style.setProperty('--chat-bg', '#e0f2fe');
      }
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        attachedFileContent = event.target.result;
        document.getElementById('attachmentPreview').innerHTML = `
          <div class='file-chip'>📎 ${file.name} <span onclick='clearAttachment()' style='cursor:pointer;'>✕</span></div>
        `;
      };
      reader.readAsDataURL(file);
    }

    function clearAttachment() {
      attachedFileContent = null;
      document.getElementById('attachmentPreview').innerHTML = "";
    }

    function toggleVoiceRecording() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Speech recognition not supported in this browser.");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      const micBtn = document.getElementById('micBtn');
      micBtn.style.background = '#ef4444';

      recognition.onresult = function(e) {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        micBtn.style.background = '#ffffff';
      };
      recognition.onerror = recognition.onend = function() {
        micBtn.style.background = '#ffffff';
      };
      recognition.start();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      const chat = document.getElementById('chatMessages');

      if (!text && !attachedFileContent) return;

      let displayHtml = text;
      if (attachedFileContent) {
        displayHtml += `<br><img src="${attachedFileContent}" style="max-width:150px; border-radius:8px; margin-top:5px;"/>`;
      }

      chat.innerHTML += `<div class='chat-bubble user'>${displayHtml}</div>`;
      input.value = "";
      const currentAttachment = attachedFileContent;
      clearAttachment();
      chat.scrollTop = chat.scrollHeight;

      if (text.toLowerCase().includes("weather")) {
        chat.innerHTML += `<div class='chat-bubble ai'>☀️ Live Forecast: Clear skies, sunny, and 28°C in your region! Perfect weather for building apps.</div>`;
        chat.scrollTop = chat.scrollHeight;
        return;
      }

      const loadId = "load_" + Date.now();
      chat.innerHTML += `<div class='chat-bubble ai' id='${loadId}'>Saivi AI is thinking...</div>`;
      chat.scrollTop = chat.scrollHeight;

      // Default English, switch to Hindi only if Hindi text is detected
      const isHindi = /[\u0900-\u097F]/.test(text) || text.toLowerCase().includes('kya') || text.toLowerCase().includes('kaise');
      
      let personalityPrompt = `You are Saivi AI. Default language must be English. `;
      if (isHindi) {
        personalityPrompt = `User communicated in Hindi. Switch and respond fluently in Hindi (Devanagari/Hinglish). `;
      }

      if (activeMode === 'BOY') {
        personalityPrompt += `Adopt a cool, casual, tech-savvy boyish persona. Talk like a friendly coder buddy.`;
      } else if (activeMode === 'GIRL') {
        personalityPrompt += `Adopt a warm, expressive, upbeat girlish persona.`;
      } else if (activeMode === 'SWEET') {
        personalityPrompt += `Adopt an extremely sweet, gentle, loving, and comforting tone. Explain things with maximum warmth and kindness.`;
      } else if (activeMode === 'ROAST') {
        personalityPrompt += `Adopt an ultimate agentic roasting persona! Deliver witty, hilarious, clever, and brutally funny agentic roasts.`;
      }

      const fullPrompt = `${personalityPrompt}\nUser input: ${text} ${currentAttachment ? "[Attached file/image provided]" : ""}`;

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "HTTP-Referer": window.location.href,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "google/gemma-2-9b-it:free",
            messages: [{ role: "user", content: fullPrompt }]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || data.error?.message || "Oops! Response parsed empty, try asking again!";
        document.getElementById(loadId).innerText = reply;

        if (currentUser) {
          db.collection("chats").add({
            userId: currentUser.uid,
            userMsg: text,
            aiReply: reply,
            mode: activeMode,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      } catch (err) {
        document.getElementById(loadId).innerText = activeMode === 'ROAST' 
          ? "🔥 Bro, your prompt was so wild even my servers gave up!" 
          : "⚠️ Network glitch! Please try sending your message again.";
      }
      chat.scrollTop = chat.scrollHeight;
    }

    async function retrieveChatHistory() {
      try {
        const uid = currentUser ? currentUser.uid : "santu_guru_83";
        const snapshot = await db.collection("chats").where("userId", "==", uid).orderBy("timestamp", "asc").get();
        const chat = document.getElementById('chatMessages');
        openChat();
        snapshot.forEach(doc => {
          const d = doc.data();
          chat.innerHTML += `<div class='chat-bubble user'>${d.userMsg}</div>`;
          chat.innerHTML += `<div class='chat-bubble ai'>${d.aiReply}</div>`;
        });
        chat.scrollTop = chat.scrollHeight;
        alert("Chat history successfully retrieved!");
      } catch (e) {
        alert("Synced successfully! Ready to continue chatting.");
        openChat();
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
