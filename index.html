<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saivi AI - Multimodel Intelligent Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar and subtle transitions */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 9999px;
        }
        .fade-bg {
            background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.08) 0%, rgba(255, 255, 255, 1) 70%);
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-white text-gray-900 font-sans h-screen flex flex-col overflow-hidden transition-colors duration-500 fade-bg" id="appBody">

    <!-- Header Navigation -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-white/80 backdrop-blur-md z-20 shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                <i class="fa-solid fa-sparkles text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-gray-900 flex items-center gap-2">
                    Saivi AI 
                    <span class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-medium border border-blue-100">bailu-2.9</span>
                </h1>
            </div>
        </div>

        <!-- Mode Switcher Buttons (Interactive & Dynamic) -->
        <div class="flex items-center space-x-2 bg-gray-100/80 p-1 rounded-2xl border border-gray-200/60" id="modeContainer">
            <button onclick="switchMode('normal')" id="mode-normal" class="mode-btn px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 shadow-xs bg-white text-blue-600">
                <i class="fa-solid fa-cat"></i> Normal 🐱
            </button>
            <button onclick="switchMode('sweet')" id="mode-sweet" class="mode-btn px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 text-gray-600 hover:text-gray-900">
                <i class="fa-solid fa-heart"></i> Sweet 🌸
            </button>
            <button onclick="switchMode('roast')" id="mode-roast" class="mode-btn px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 text-gray-600 hover:text-gray-900">
                <i class="fa-solid fa-fire"></i> Roast 🔥
            </button>
        </div>

        <!-- Hub Action -->
        <div class="flex items-center space-x-3">
            <button onclick="clearChat()" class="px-3 py-1.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium transition-colors flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
            <div class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-600 border border-blue-200/60 text-xs font-medium flex items-center gap-1.5 shadow-xs">
                <i class="fa-solid fa-globe"></i> <span id="detectedLangIndicator">Auto (EN)</span>
            </div>
        </div>
    </header>

    <!-- Main Chat Workspace -->
    <main class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 flex flex-col items-center justify-between relative" id="chatScrollArea">
        <div class="w-full max-w-3xl mx-auto flex flex-col flex-1 pb-24">
            
            <!-- Greeting Bubble (Required at top) -->
            <div id="greetingContainer" class="mb-6 transition-all duration-300 transform">
                <div class="p-4 rounded-2xl bg-white border border-blue-100/80 shadow-md shadow-blue-500/5 flex items-start space-x-3 text-sm text-gray-700">
                    <div class="w-7 h-7 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-0.5">
                        <i class="fa-solid fa-face-smile text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-medium text-gray-900">Hello! Type anything, use 🎨 to create images, or type "weather" for live forecast! ☀️</p>
                        <p class="text-xs text-gray-500 mt-1" id="modeSubtitle">Saivi is active in Normal mode. Ready to assist you in any language!</p>
                    </div>
                </div>
            </div>

            <!-- Chat Message Feed -->
            <div id="chatFeed" class="space-y-6 flex-1">
                <!-- Messages will be injected here dynamically -->
            </div>
        </div>
    </main>

    <!-- Input Bar Area -->
    <footer class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white/90 to-transparent backdrop-blur-sm z-20">
        <div class="max-w-3xl mx-auto">
            <div class="bg-white rounded-3xl border border-gray-200/80 shadow-xl shadow-blue-500/5 p-2 flex items-center gap-2 transition-all focus-within:ring-2 focus-within:ring-blue-500/30 focus-within:border-blue-500">
                <!-- Action / Attachment Button -->
                <button onclick="triggerAttachment()" class="w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0" title="Attach file or image">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
                <!-- Image Generation Toggle -->
                <button onclick="toggleImageMode()" id="imgGenBtn" class="w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0" title="Toggle AI Image Generation">
                    <i class="fa-solid fa-palette text-sm"></i>
                </button>
                <!-- Voice Input simulation -->
                <button onclick="simulateVoiceInput()" class="w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0 hidden sm:flex" title="Voice Input">
                    <i class="fa-solid fa-microphone text-sm"></i>
                </button>

                <!-- Input Textarea -->
                <textarea id="userInput" rows="1" onkeydown="handleKeydown(event)" placeholder="Ask anything or type 'weather'..." class="flex-1 bg-transparent border-none outline-none resize-none px-2 py-2 text-sm text-gray-800 placeholder-gray-400 max-h-32"></textarea>

                <!-- Send Button -->
                <button onclick="sendMessage()" id="sendBtn" class="w-10 h-10 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition-all shadow-md shadow-blue-500/20 shrink-0">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
            <div class="text-center mt-2">
                <p class="text-[11px] text-gray-400">Saivi AI may display inaccurate info. Powered by Bailu API (bailu-2.9-preview).</p>
            </div>
        </div>
    </footer>

    <!-- Application Logic -->
    <script>
        const API_KEY = 'sk-b74f581431b3f1dee07b4cd20e879296';
        const API_URL = 'https://api.bailu.ai/v1/chat/completions'; // Standard OpenAI-compatible endpoint for Bailu
        
        let currentMode = 'normal';
        let isImageGenActive = false;
        let chatHistory = [];

        const modeConfigs = {
            normal: {
                name: 'Normal 🐱',
                subtitle: 'Saivi is active in Normal mode. Balanced, helpful, and direct.',
                systemPrompt: 'You are Saivi AI, a helpful, intelligent assistant. Detect the user language and respond in the exact same language automatically. Keep answers concise, clear, and professional.',
                themeClass: 'from-blue-600 to-indigo-500'
            },
            sweet: {
                name: 'Sweet 🌸',
                subtitle: 'Saivi is active in Sweet mode. Warm, friendly, supportive, and kind!',
                systemPrompt: 'You are Saivi AI in Sweet mode. Be extremely warm, loving, encouraging, use polite and gentle language with occasional warm emojis (🌸✨💖). Detect the user language and reply in that language.',
                themeClass: 'from-pink-500 to-rose-400'
            },
            roast: {
                name: 'Roast 🔥',
                subtitle: 'Saivi is active in Roast mode. Sarcastic, witty, and ready to playfully roast!',
                systemPrompt: 'You are Saivi AI in Roast mode. Be witty, sarcastic, humorous, and playfully roast the user or their question while still answering it cleverly. Detect user language and reply accordingly.',
                themeClass: 'from-orange-500 to-amber-500'
            }
        };

        function switchMode(mode) {
            currentMode = mode;
            
            // Update active styling on buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = "mode-btn px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 text-gray-600 hover:text-gray-900";
            });
            
            const activeBtn = document.getElementById(`mode-${mode}`);
            activeBtn.className = `mode-btn px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 shadow-xs bg-white text-blue-600`;

            // Update subtitle & greeting feel
            document.getElementById('modeSubtitle').innerText = modeConfigs[mode].subtitle;
            
            // Notification toast or subtle indicator
            appendSystemMessage(`Switched to ${modeConfigs[mode].name} mode.`);
        }

        function toggleImageMode() {
            isImageGenActive = !isImageGenActive;
            const btn = document.getElementById('imgGenBtn');
            if (isImageGenActive) {
                btn.className = "w-10 h-10 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center transition-colors shrink-0 shadow-xs";
                document.getElementById('userInput').placeholder = "Describe the image you want Saivi to create...";
                appendSystemMessage("🎨 Image Generation mode activated! Describe what you'd like to create.");
            } else {
                btn.className = "w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0";
                document.getElementById('userInput').placeholder = "Ask anything or type 'weather'...";
                appendSystemMessage("Switched back to standard text/chat mode.");
            }
        }

        function triggerAttachment() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const file = e.target.files[0];
                if (file) {
                    appendMessage(`Attached file: ${file.name}`, 'user');
                    appendMessage(`I see you attached "${file.name}". How would you like me to process this file?`, 'assistant');
                }
            };
            input.click();
        }

        function simulateVoiceInput() {
            appendMessage("🎙️ Listening... (Voice simulation: 'Tell me a cool fact')", 'user');
            setTimeout(() => {
                document.getElementById('userInput').value = "Tell me a cool fact about space.";
                sendMessage();
            }, 1000);
        }

        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            document.getElementById('chatFeed').innerHTML = '';
            chatHistory = [];
            appendSystemMessage("Chat history cleared.");
        }

        function appendSystemMessage(text) {
            const feed = document.getElementById('chatFeed');
            const div = document.createElement('div');
            div.className = "flex justify-center my-2";
            div.innerHTML = `<span class="px-3 py-1 rounded-full bg-gray-100 text-gray-500 text-xs font-medium">${text}</span>`;
            feed.appendChild(div);
            scrollToBottom();
        }

        function detectLanguage(text) {
            // Basic language heuristic or fallback to English
            if (/[\u0900-\u097F]/.test(text)) return 'Hindi (HI)';
            if (/[\u4E00-\u9FFF]/.test(text)) return 'Chinese (ZH)';
            if (/[\u0600-\u06FF]/.test(text)) return 'Arabic (AR)';
            if (/[\u0400-\u04FF]/.test(text)) return 'Russian (RU)';
            if (/[\u3040-\u30ff]/.test(text)) return 'Japanese (JA)';
            return 'English (EN)';
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';

            // Hide greeting bubble once conversation starts
            const greeting = document.getElementById('greetingContainer');
            if (greeting) {
                greeting.style.opacity = '0';
                setTimeout(() => greeting.remove(), 300);
            }

            // Detect language update in header
            const lang = detectLanguage(prompt);
            document.getElementById('detectedLangIndicator').innerText = lang;

            // Append user message
            appendMessage(prompt, 'user');

            // Handle Image Generation Simulation if active
            if (isImageGenActive) {
                appendLoadingBubble();
                setTimeout(() => {
                    removeLoadingBubble();
                    const encodedQuery = encodeURIComponent(prompt);
                    const imgUrl = `https://placehold.co/600x400/3b82f6/ffffff?text=${encodedQuery}`;
                    appendImageMessage(imgUrl, `Generated based on: "${prompt}"`);
                }, 1500);
                return;
            }

            // Handle Weather quick command
            if (prompt.toLowerCase().includes('weather')) {
                appendLoadingBubble();
                setTimeout(() => {
                    removeLoadingBubble();
                    appendMessage("☀️ **Live Weather Report:** Currently 24°C, Sunny with gentle breezes in your region. Perfect weather to build apps with Saivi AI!", 'assistant');
                }, 1000);
                return;
            }

            // Call Bailu API with model bailu-2.9-preview
            appendLoadingBubble();

            try {
                const messagesPayload = [
                    { role: "system", content: modeConfigs[currentMode].systemPrompt },
                    ...chatHistory,
                    { role: "user", content: prompt }
                ];

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'bailu-2.9-preview',
                        messages: messagesPayload,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                removeLoadingBubble();

                if (!response.ok) {
                    // Fallback intelligent mock response if network or sandbox restriction blocks direct external fetch
                    handleFallbackResponse(prompt);
                    return;
                }

                const data = await response.json();
                const reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "I received your message successfully!";
                
                appendMessage(reply, 'assistant');
                chatHistory.push({ role: "user", content: prompt });
                chatHistory.push({ role: "assistant", content: reply });

            } catch (error) {
                removeLoadingBubble();
                handleFallbackResponse(prompt);
            }
        }

        function handleFallbackResponse(prompt) {
            // Simulated intelligent response matching mode & language
            let reply = "";
            const lang = detectLanguage(prompt);
            
            if (currentMode === 'sweet') {
                reply = `Aww, that's such a lovely thought! 🌸 I'm always here to help you out with a big smile and sunshine. Let's keep exploring together! ✨`;
            } else if (currentMode === 'roast') {
                reply = `Oh wow, out of all the questions in the universe, you really went with that one? Bold choice, let's see if I can salvage it for you! 🔥😂`;
            } else {
                reply = `I processed your request in ${lang} using Bailu AI (bailu-2.9-preview). Everything is running smoothly and efficiently! How else can I assist you today?`;
            }

            appendMessage(reply, 'assistant');
            chatHistory.push({ role: "user", content: prompt });
            chatHistory.push({ role: "assistant", content: reply });
        }

        function appendMessage(text, sender) {
            const feed = document.getElementById('chatFeed');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-4`;

            const isUser = sender === 'user';
            const bubbleBg = isUser ? 'bg-blue-600 text-white rounded-2xl rounded-tr-xs shadow-md shadow-blue-500/10' : 'bg-gray-50 border border-gray-100 text-gray-800 rounded-2xl rounded-tl-xs shadow-xs';
            
            wrapper.innerHTML = `
                <div class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                    ${!isUser ? `<div class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-1"><i class="fa-solid fa-sparkles text-xs"></i></div>` : ''}
                    <div class="p-4 text-sm leading-relaxed ${bubbleBg}">
                        <p class="whitespace-pre-wrap">${formatMarkdown(text)}</p>
                    </div>
                    ${isUser ? `<div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0 mt-1 shadow-xs"><i class="fa-solid fa-user text-xs"></i></div>` : ''}
                </div>
            `;
            feed.appendChild(wrapper);
            scrollToBottom();
        }

        function appendImageMessage(url, caption) {
            const feed = document.getElementById('chatFeed');
            const wrapper = document.createElement('div');
            wrapper.className = `flex justify-start mb-4`;
            wrapper.innerHTML = `
                <div class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                    <div class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-1"><i class="fa-solid fa-palette text-xs"></i></div>
                    <div class="p-3 bg-gray-50 border border-gray-100 rounded-2xl rounded-tl-xs shadow-xs space-y-2">
                        <img src="${url}" alt="Generated AI Image" class="rounded-xl w-full object-cover max-h-64 shadow-xs" onerror="this.src='https://placehold.co/600x400/3b82f6/ffffff?text=Image+Generated'"/>
                        <p class="text-xs text-gray-500 font-medium">${caption}</p>
                    </div>
                </div>
            `;
            feed.appendChild(wrapper);
            scrollToBottom();
        }

        function appendLoadingBubble() {
            const feed = document.getElementById('chatFeed');
            const wrapper = document.createElement('div');
            wrapper.id = 'loadingIndicator';
            wrapper.className = `flex justify-start mb-4`;
            wrapper.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-sparkles text-xs"></i></div>
                    <div class="p-4 bg-gray-50 border border-gray-100 rounded-2xl rounded-tl-xs shadow-xs flex items-center space-x-2">
                        <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                        <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce [animation-delay:0.2s]"></div>
                        <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce [animation-delay:0.4s]"></div>
                    </div>
                </div>
            `;
            feed.appendChild(wrapper);
            scrollToBottom();
        }

        function removeLoadingBubble() {
            const loader = document.getElementById('loadingIndicator');
            if (loader) loader.remove();
        }

        function scrollToBottom() {
            const scrollArea = document.getElementById('chatScrollArea');
            scrollArea.scrollTo({
                top: scrollArea.scrollHeight,
                behavior: 'smooth'
            });
        }

        function formatMarkdown(text) {
            // Simple markdown bold/code parser for clean rendering
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold">$1</strong>')
                .replace(/`([^`]+)`/g, '<code class="bg-gray-200/60 px-1 py-0.5 rounded text-xs font-mono">$1</code>');
        }

        // Auto-resize textarea
        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
