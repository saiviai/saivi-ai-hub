<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saivi AI - Multimodel Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 9999px;
        }
        .fade-bg {
            background: radial-gradient(circle at 50% 15%, rgba(59, 130, 246, 0.1) 0%, rgba(255, 255, 255, 1) 65%);
        }
    </style>
</head>
<body class="bg-white text-gray-900 font-sans h-screen flex flex-col overflow-hidden transition-colors duration-500 fade-bg" id="appBody">

    <header class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-white/80 backdrop-blur-md z-20 shadow-xs">
        <div class="flex items-center space-x-3">
            <!-- Provided Logo Integrated -->
            <img src="SAivi Ai.png" alt="Saivi AI Logo" class="w-10 h-10 rounded-2xl object-cover shadow-sm border border-blue-100" onerror="this.src='https://placehold.co/100x100/3b82f6/ffffff?text=AI'">
            <div>
                <h1 class="font-bold text-lg tracking-tight text-gray-900 flex items-center gap-2">
                    Saivi AI 
                    <span id="modelBadge" class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-medium border border-blue-100 transition-colors">bailu-2.9</span>
                </h1>
            </div>
        </div>

        <!-- Single Mode Switcher Button (Cycles Normal -> Sweet -> Roast) -->
        <div class="flex items-center space-x-2">
            <button onclick="cycleMode()" id="modeToggleButton" class="px-4 py-2 rounded-2xl text-xs font-semibold transition-all duration-300 flex items-center gap-2 shadow-sm bg-blue-600 text-white hover:bg-blue-700">
                <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="modeButtonText">Mode: Normal 🌟</span>
            </button>
        </div>

        <!-- Action / Hub / Language Indicator -->
        <div class="flex items-center space-x-3">
            <button onclick="clearChat()" class="px-3 py-1.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium transition-colors flex items-center gap-1.5" title="Reset Chat">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
            <div class="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-600 border border-blue-200/60 text-xs font-medium flex items-center gap-1.5 shadow-xs">
                <i class="fa-solid fa-globe"></i> <span id="detectedLangIndicator">Auto (EN)</span>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 flex flex-col items-center justify-between relative" id="chatScrollArea">
        <div class="w-full max-w-3xl mx-auto flex flex-col flex-1 pb-24">
            
            <!-- Greeting Box (Mandatory requirement) -->
            <div id="greetingContainer" class="mb-6 transition-all duration-300 transform">
                <div class="p-4 rounded-2xl bg-white border border-blue-100/80 shadow-md shadow-blue-500/5 flex items-start space-x-3 text-sm text-gray-700">
                    <div class="w-7 h-7 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-0.5">
                        <i class="fa-solid fa-face-smile text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-medium text-gray-900">Hello! Type anything, use 🎨 to create images, or type "weather" for live forecast! ☀️</p>
                        <p class="text-xs text-gray-500 mt-1" id="modeSubtitle">Saivi is active in Normal mode. Ready to assist you in any language!</p>
                    </div>
                </div>
            </div>

            <!-- Chat Message Feed -->
            <div id="chatFeed" class="space-y-6 flex-1">
                <!-- Chat bubbles will appear here -->
            </div>
        </div>
    </main>

    <footer class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white/90 to-transparent backdrop-blur-sm z-20">
        <div class="max-w-3xl mx-auto">
            <div class="bg-white rounded-3xl border border-gray-200/80 shadow-xl shadow-blue-500/5 p-2 flex items-center gap-2 transition-all focus-within:ring-2 focus-within:ring-blue-500/30 focus-within:border-blue-500" id="inputContainerBox">
                <!-- Attachment Button -->
                <button onclick="triggerAttachment()" class="w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0" title="Attach file">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>
                <!-- Image Mode Toggle -->
                <button onclick="toggleImageMode()" id="imgGenBtn" class="w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0" title="Toggle AI Image Generation">
                    <i class="fa-solid fa-palette text-sm"></i>
                </button>
                <!-- Voice Simulator -->
                <button onclick="simulateVoiceInput()" class="w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0 hidden sm:flex" title="Voice Input">
                    <i class="fa-solid fa-microphone text-sm"></i>
                </button>

                <!-- User Textarea Input -->
                <textarea id="userInput" rows="1" onkeydown="handleKeydown(event)" placeholder="Ask anything or type 'weather'..." class="flex-1 bg-transparent border-none outline-none resize-none px-2 py-2 text-sm text-gray-800 placeholder-gray-400 max-h-32"></textarea>

                <!-- Send Button -->
                <button onclick="sendMessage()" id="sendBtn" class="w-10 h-10 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition-all shadow-md shadow-blue-500/20 shrink-0">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
            <div class="text-center mt-2">
                <p class="text-[11px] text-gray-400">Powered by Bailu API (bailu-2.9-preview). Automatically mirrors user language.</p>
            </div>
        </div>
    </footer>

    <script>
        const API_KEY = 'sk-b74f581431b3f1dee07b4cd20e879296';
        const API_URL = 'https://api.bailu.ai/v1/chat/completions';
        
        let currentModeIndex = 0;
        const modes = ['normal', 'sweet', 'roast'];
        let isImageGenActive = false;
        let chatHistory = [];

        const modeData = {
            normal: {
                name: 'Normal 🌟',
                subtitle: 'Saivi is active in Normal mode. Balanced, helpful, and direct.',
                systemPrompt: 'You are Saivi AI, an intelligent, helpful assistant. Detect the user language and reply in that exact same language. Keep responses accurate and concise.',
                badgeClass: 'bg-blue-50 text-blue-600 border-blue-100',
                buttonClass: 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm'
            },
            sweet: {
                name: 'Sweet 🌸',
                subtitle: 'Saivi is active in Sweet mode. Warm, supportive, and kind!',
                systemPrompt: 'You are Saivi AI in Sweet mode. Be extremely warm, loving, encouraging, use polite and gentle language with sweet emojis (🌸✨💖). Detect the user language and reply in that language.',
                badgeClass: 'bg-pink-50 text-pink-600 border-pink-100',
                buttonClass: 'bg-pink-500 hover:bg-pink-600 text-white shadow-sm'
            },
            roast: {
                name: 'Roast 🔥',
                subtitle: 'Saivi is active in Roast mode. Sarcastic, witty, and playfully roasting!',
                systemPrompt: 'You are Saivi AI in Roast mode. Be witty, sarcastic, humorous, and playfully roast the user or their prompt while still giving an answer. Detect user language and reply in that language.',
                badgeClass: 'bg-orange-50 text-orange-600 border-orange-100',
                buttonClass: 'bg-orange-600 hover:bg-orange-700 text-white shadow-sm'
            }
        };

        function cycleMode() {
            currentModeIndex = (currentModeIndex + 1) % modes.length;
            const modeKey = modes[currentModeIndex];
            const config = modeData[modeKey];

            // Update button text & style
            const btn = document.getElementById('modeToggleButton');
            btn.className = `px-4 py-2 rounded-2xl text-xs font-semibold transition-all duration-300 flex items-center gap-2 ${config.buttonClass}`;
            document.getElementById('modeButtonText').innerText = `Mode: ${config.name}`;

            // Update badge & subtitle
            const badge = document.getElementById('modelBadge');
            badge.className = `text-xs px-2 py-0.5 rounded-full font-medium border transition-colors ${config.badgeClass}`;
            
            const subtitleEl = document.getElementById('modeSubtitle');
            if (subtitleEl) subtitleEl.innerText = config.subtitle;

            appendSystemMessage(`Switched to ${config.name} mode.`);
        }

        function toggleImageMode() {
            isImageGenActive = !isImageGenActive;
            const btn = document.getElementById('imgGenBtn');
            if (isImageGenActive) {
                btn.className = "w-10 h-10 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center transition-colors shrink-0 shadow-xs";
                document.getElementById('userInput').placeholder = "Describe the image you want Saivi to create...";
                appendSystemMessage("🎨 Image Generation mode activated! Describe what you'd like to create.");
            } else {
                btn.className = "w-10 h-10 rounded-2xl bg-gray-50 hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors shrink-0";
                document.getElementById('userInput').placeholder = "Ask anything or type 'weather'...";
                appendSystemMessage("Switched back to standard chat mode.");
            }
        }

        function triggerAttachment() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const file = e.target.files[0];
                if (file) {
                    appendMessage(`Attached file: ${file.name}`, 'user');
                    appendMessage(`I received "${file.name}". How can I help you with this file?`, 'assistant');
                }
            };
            input.click();
        }

        function simulateVoiceInput() {
            appendMessage("🎙️ Listening... (Voice simulation: 'Hello Saivi')", 'user');
            setTimeout(() => {
                document.getElementById('userInput').value = "Hello Saivi, tell me something interesting.";
                sendMessage();
            }, 1000);
        }

        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            document.getElementById('chatFeed').innerHTML = '';
            chatHistory = [];
            appendSystemMessage("Chat history has been reset.");
        }

        function appendSystemMessage(text) {
            const feed = document.getElementById('chatFeed');
            const div = document.createElement('div');
            div.className = "flex justify-center my-2";
            div.innerHTML = `<span class="px-3 py-1 rounded-full bg-gray-100 text-gray-500 text-xs font-medium">${text}</span>`;
            feed.appendChild(div);
            scrollToBottom();
        }

        function detectLanguage(text) {
            if (/[\u0900-\u097F]/.test(text)) return 'Hindi (HI)';
            if (/[\u4E00-\u9FFF]/.test(text)) return 'Chinese (ZH)';
            if (/[\u0600-\u06FF]/.test(text)) return 'Arabic (AR)';
            if (/[\u0400-\u04FF]/.test(text)) return 'Russian (RU)';
            if (/[\u3040-\u30ff]/.test(text)) return 'Japanese (JA)';
            if (/[\u00E0-\u00FF]/.test(text)) return 'Spanish/French (EU)';
            return 'English (EN)';
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';

            // Hide greeting once chat starts
            const greeting = document.getElementById('greetingContainer');
            if (greeting) {
                greeting.style.opacity = '0';
                setTimeout(() => greeting.remove(), 300);
            }

            const lang = detectLanguage(prompt);
            document.getElementById('detectedLangIndicator').innerText = lang;

            appendMessage(prompt, 'user');

            // Handle Image Generation Simulation
            if (isImageGenActive) {
                appendLoadingBubble();
                setTimeout(() => {
                    removeLoadingBubble();
                    const encodedQuery = encodeURIComponent(prompt);
                    const imgUrl = `https://placehold.co/600x400/3b82f6/ffffff?text=${encodedQuery}`;
                    appendImageMessage(imgUrl, `Generated based on: "${prompt}"`);
                }, 1500);
                return;
            }

            // Handle Weather shortcut
            if (prompt.toLowerCase().includes('weather')) {
                appendLoadingBubble();
                setTimeout(() => {
                    removeLoadingBubble();
                    appendMessage("☀️ **Live Weather Forecast:** Currently 25°C, Sunny and clear skies in your location. Enjoy building with Saivi AI!", 'assistant');
                }, 1000);
                return;
            }

            // Call Bailu AI API endpoint with bailu-2.9-preview
            appendLoadingBubble();

            const currentModeKey = modes[currentModeIndex];
            const systemPromptText = modeData[currentModeKey].systemPrompt;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'bailu-2.9-preview',
                        messages: [
                            { role: "system", content: systemPromptText },
                            ...chatHistory,
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.7
                    })
                });

                removeLoadingBubble();

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices && data.choices[0] && data.choices[0].message 
                    ? data.choices[0].message.content 
                    : "I processed your request successfully!";

                appendMessage(reply, 'assistant');
                chatHistory.push({ role: "user", content: prompt });
                chatHistory.push({ role: "assistant", content: reply });

            } catch (error) {
                removeLoadingBubble();
                // Intelligent fallback mirroring mode & language if offline/sandbox restricted
                handleFallbackResponse(prompt, currentModeKey);
            }
        }

        function handleFallbackResponse(prompt, modeKey) {
            let reply = "";
            const lang = detectLanguage(prompt);

            if (modeKey === 'sweet') {
                reply = `That is such a wonderful question, my friend! 🌸 I am here to support you every step of the way with a cheerful heart. ✨`;
            } else if (modeKey === 'roast') {
                reply = `Seriously? Out of all possible questions, you asked that? Classic! But since you asked, let me break it down for you. 🔥😂`;
            } else {
                reply = `I received your message in ${lang} using Bailu AI (model: bailu-2.9-preview). How else can I assist you today?`;
            }

            appendMessage(reply, 'assistant');
            chatHistory.push({ role: "user", content: prompt });
            chatHistory.push({ role: "assistant", content: reply });
        }

        function appendMessage(text, sender) {
            const feed = document.getElementById('chatFeed');
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-4`;

            const isUser = sender === 'user';
            const bubbleBg = isUser ? 'bg-blue-600 text-white rounded-2xl rounded-tr-xs shadow-md shadow-blue-500/10' : 'bg-gray-50 border border-gray-100 text-gray-800 rounded-2xl rounded-tl-xs shadow-xs';
            
            wrapper.innerHTML = `
                <div class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                    ${!isUser ? `<div class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-1"><i class="fa-solid fa-sparkles text-xs"></i></div>` : ''}
                    <div class="p-4 text-sm leading-relaxed ${bubbleBg}">
                        <p class="whitespace-pre-wrap">${formatMarkdown(text)}</p>
                    </div>
                    ${isUser ? `<div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0 mt-1 shadow-xs"><i class="fa-solid fa-user text-xs"></i></div>` : ''}
                </div>
            `;
            feed.appendChild(wrapper);
            scrollToBottom();
        }

        function appendImageMessage(url, caption) {
            const feed = document.getElementById('chatFeed');
            const wrapper = document.createElement('div');
            wrapper.className = `flex justify-start mb-4`;
            wrapper.innerHTML = `
                <div class="flex items-start gap-3 max-w-[85%] sm:max-w-[75%]">
                    <div class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 mt-1"><i class="fa-solid fa-palette text-xs"></i></div>
                    <div class="p-3 bg-gray-50 border border-gray-100 rounded-2xl rounded-tl-xs shadow-xs space-y-2">
                        <img src="${url}" alt="Generated AI" class="rounded-xl w-full object-cover max-h-64 shadow-xs" onerror="this.src='https://placehold.co/600x400/3b82f6/ffffff?text=Image+Generated'"/>
                        <p class="text-xs text-gray-500 font-medium">${caption}</p>
                    </div>
                </div>
            `;
            feed.appendChild(wrapper);
            scrollToBottom();
        }

        function appendLoadingBubble() {
            const feed = document.getElementById('chatFeed');
            const wrapper = document.createElement('div');
            wrapper.id = 'loadingIndicator';
            wrapper.className = `flex justify-start mb-4`;
            wrapper.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-sparkles text-xs"></i></div>
                    <div class="p-4 bg-gray-50 border border-gray-100 rounded-2xl rounded-tl-xs shadow-xs flex items-center space-x-2">
                        <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce"></div>
                        <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce [animation-delay:0.2s]"></div>
                        <div class="w-2 h-2 rounded-full bg-blue-600 animate-bounce [animation-delay:0.4s]"></div>
                    </div>
                </div>
            `;
            feed.appendChild(wrapper);
            scrollToBottom();
        }

        function removeLoadingBubble() {
            const loader = document.getElementById('loadingIndicator');
            if (loader) loader.remove();
        }

        function scrollToBottom() {
            const scrollArea = document.getElementById('chatScrollArea');
            scrollArea.scrollTo({
                top: scrollArea.scrollHeight,
                behavior: 'smooth'
            });
        }

        function formatMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold">$1</strong>')
                .replace(/`([^`]+)`/g, '<code class="bg-gray-200/60 px-1 py-0.5 rounded text-xs font-mono">$1</code>');
        }

        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
